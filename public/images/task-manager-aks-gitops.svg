<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Task Manager Azure Kubernetes Service, GitOps and operations architecture</title>
<desc id="desc">Terraform provisions Azure AKS networking. GitHub Actions builds SHA-tagged images and updates Git manifests. Argo CD App-of-Apps synchronizes platform and workloads. Linkerd provides mTLS. Prometheus and Grafana observe workloads. HPA manages replicas independently of Argo CD.</desc>
