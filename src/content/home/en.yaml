work:
  heading: Selected work
  intro: Projects I designed and built, with a focus on technical decisions, automation and outcomes—not 
    just the tools used.
  cards:
  - slug: kubeforge
    color: lilac
    kicker: Platform Engineering · Kubernetes · GitOps
    title: KubeForge
    visual:
      kind: image
      src: kubeforge.gif
      alt: Animated KubeForge architecture showing GitHub pull-request validation, GitOps, Crossplane 
        reconciliation and the eight managed Kubernetes objects.
    summary: I designed and built a Kubernetes self-service platform that turns a single DevEnvironment 
      request into a managed environment, with automated validation, GitOps delivery and reconciliation.
    badges:
    - Crossplane v2
    - 8 managed resources
    - 10/10 E2E tests
    proof:
    - Designed the **Crossplane v2 API extension and Go-templated Composition** to provision and 
      continuously reconcile **8 Kubernetes resources**.
    - Developed **Python pull-request validation**, enforced required CI checks, configured **Argo CD** 
      synchronization and verified the platform with **10/10 E2E tests**.
    stack:
    - Kubernetes
    - Crossplane
    - Go templating
    - Python
    - GitHub Actions
    - Argo CD
    cta: Explore case study
    links:
    - label: Source on GitHub
      href: https://github.com/chedli01/KubeForge
  - slug: task-manager
    color: mint
    kicker: Cloud Engineering · Azure · SRE
    title: Task Manager — Cloud & GitOps
    visual:
      kind: image
      src: task-manager.gif
      alt: Animated architecture diagram of the Azure VM deployment strategy and CI/CD pipeline for Task 
        Manager.
    summary: I engineered two automated Azure infrastructure paths—a cost-conscious VM and a scalable AKS
      platform—and delivered a documented 5-minute code-to-deployment GitOps workflow.
    badges:
    - 2 infrastructure strategies
    - 5-minute GitOps cycle
    proof:
    - Provisioned **Azure VM and AKS with Terraform**, automated configuration with **Ansible and Helm**,
      and added **Prometheus/Grafana** observability.
    - Built **SHA-tagged CI-to-GitOps delivery** and resolved an **Argo CD/HPA reconciliation conflict** 
      so autoscaling works without controller interference.
    stack:
    - Azure
    - Terraform
    - Ansible
    - AKS
    - Helm
    - Argo CD
    - Prometheus
    cta: Explore case study
    links:
    - label: Source on GitHub
      href: https://github.com/chedli01/task_management_devops
  - slug: azure-subscription-factory
    color: sky
    kicker: Cloud Governance · Terraform · GitLab CI/CD
    title: Azure Subscription Factory
    visual:
      kind: image
      src: azure-factory.svg
      alt: 'Expanded Azure Subscription Factory architecture: request portal, YAML, GitLab Terraform stages,
        manual review and Azure MCA / Management Group association.'
    summary: I built a controlled Azure subscription provisioning workflow that transforms dashboard 
      requests into reviewed Terraform changes, while respecting billing scopes and the Management Group 
      hierarchy.
    badges:
    - IaC automation
    - Manual approval gate
    proof:
    - Implemented a **YAML-driven Terraform `azurerm_subscription` module** for subscription creation 
      under the correct **MCA billing scope** and Management Group.
    - Automated **validate → plan → manual approval → apply** in **GitLab CI/CD**, enabling plan review 
      before changes are executed with service-principal authentication.
    stack:
    - Azure
    - Terraform
    - GitLab CI/CD
    - YAML
    - MCA
    - Management Groups
    cta: Explore case study
  - slug: cloud-policy-guardrails
    color: peach
    kicker: DevSecOps · Policy-as-Code · Cognira internship
    title: Cloud Policy-as-Code Guardrails
    visual:
      kind: image
      src: cognira.jpg
      alt: Architecture diagram of Terraform plan JSON processed by Conftest and Rego policies, a Python 
        reporter and review/enforcement decisions.
    summary: 'At Cognira, I architected pre-deployment guardrails for Terraform-managed Azure infrastructure:
      custom policies, actionable Python verdicts and auditable CI enforcement.'
    badges:
    - ~50 policies
    - 15 governance domains
    proof:
    - Authored **~50 Rego deny/warn policies across 15 governance domains** and integrated 
      **Conftest/OPA** checks of Terraform plans.
    - Developed a **Python decision/reporting engine**, GitHub Actions **audit and strict modes**, and 
      **time-limited, traceable exceptions**.
    stack:
    - Terraform
    - Azure
    - OPA
    - Rego
    - Conftest
    - Python
    - GitHub Actions
    cta: Explore case study
