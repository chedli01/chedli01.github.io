work:
  heading: Selected work
  intro: Selected infrastructure and platform projects, from self-service Kubernetes environments to secure
    Azure delivery and cloud automation.
  cards:
  - slug: kubeforge
    color: lilac
    kicker: Platform Engineering · Kubernetes · GitOps
    title: KubeForge
    visual:
      kind: image
      src: kubeforge.gif
      alt: Animated KubeForge architecture showing GitHub pull-request validation, GitOps, Crossplane reconciliation
        and the eight managed Kubernetes objects.
    summary: I designed and built a Kubernetes self-service prototype that lets developers request and manage
      logical environments in an existing shared cluster through one high-level YAML manifest. Tested on a
      local kind cluster.
    badges:
    - Crossplane v2
    - 8 managed resources
    - 10/10 E2E tests
    proof:
    - Extended the **Kubernetes API with a Crossplane v2 XRD** and built a Go-templated Composition reconciling
      **8 native resources** per `DevEnvironment`.
    - Integrated a **Python manifest validator into required GitHub Actions PR checks**, configured **Argo
      CD synchronization**, and passed **10/10 automated E2E stages**.
    stack:
    - Kubernetes
    - Crossplane
    - Go templating
    - Python
    - GitHub Actions
    - Argo CD
    cta: Explore case study
    links:
    - label: Source on GitHub
      href: https://github.com/chedli01/KubeForge
  - slug: task-manager
    color: mint
    kicker: Cloud Engineering · Azure · SRE
    title: Task Manager — Cloud & GitOps
    visual:
      kind: image
      src: task-manager.gif
      alt: Animated architecture diagram of the Azure VM deployment strategy and CI/CD pipeline for Task Manager.
    summary: I built two Azure infrastructure paths—an automated VM stack and an AKS-based cloud-native platform—then
      connected CI, GitOps, observability and service-mesh security.
    badges:
    - 2 infrastructure strategies
    - 5-minute GitOps cycle
    proof:
    - Provisioned the **VM and AKS with Terraform**, automated software delivery with **Ansible, Helm and
      Argo CD**, and implemented Prometheus/Grafana monitoring.
    - Delivered an approximately **5-minute code-to-deployment cycle** and resolved an **Argo CD–HPA replicas
      conflict** so autoscaling could work as intended.
    stack:
    - Azure
    - Terraform
    - Ansible
    - AKS
    - Helm
    - Argo CD
    - Prometheus
    cta: Explore case study
    links:
    - label: Source on GitHub
      href: https://github.com/chedli01/task_management_devops
  - slug: azure-subscription-factory
    color: sky
    kicker: Cloud Governance · Terraform · GitLab CI/CD
    title: Azure Subscription Factory
    visual:
      kind: image
      src: azure-factory.svg
      alt: 'Expanded Azure Subscription Factory architecture: request portal, YAML, GitLab Terraform stages,
        manual review and Azure MCA / Management Group association.'
    summary: I built a controlled Azure subscription provisioning workflow that transforms dashboard requests
      into reviewed Terraform changes, while respecting billing scopes and the Management Group hierarchy.
    badges:
    - IaC automation
    - Manual approval gate
    proof:
    - Implemented a **YAML-driven Terraform `azurerm_subscription` module** for subscription creation under
      the correct **MCA billing scope** and Management Group.
    - Automated **validate → plan → manual approval → apply** in **GitLab CI/CD**, enabling plan review before
      changes are executed with service-principal authentication.
    stack:
    - Azure
    - Terraform
    - GitLab CI/CD
    - YAML
    - MCA
    - Management Groups
    cta: Explore case study
  - slug: cloud-policy-guardrails
    color: peach
    kicker: DevSecOps · Policy-as-Code · Cognira internship
    title: Cloud Policy-as-Code Guardrails
    visual:
      kind: image
      src: cognira.jpg
      alt: Architecture diagram of Terraform plan JSON processed by Conftest and Rego policies, a Python reporter
        and review/enforcement decisions.
    summary: 'At Cognira, I architected pre-deployment guardrails for Terraform-managed Azure infrastructure:
      custom policies, actionable Python verdicts and auditable CI enforcement.'
    badges:
    - ~50 policies
    - 15 governance domains
    proof:
    - Authored **~50 Rego deny/warn policies across 15 governance domains** and integrated **Conftest/OPA**
      checks of Terraform plans.
    - Developed a **Python decision/reporting engine**, GitHub Actions **audit and strict modes**, and **time-limited,
      traceable exceptions**.
    stack:
    - Terraform
    - Azure
    - OPA
    - Rego
    - Conftest
    - Python
    - GitHub Actions
    cta: Explore case study
